{% extends "base.html" %}
{% block title %}修改密码 - {{ shop.shop_name }}{% endblock %}
{% block content %}
<h5 class="mb-3">🔑 账号与密码</h5>
<div class="card table-card shadow-sm" style="max-width: 480px;"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label">登录账号</label>
      <input class="form-control" name="username" value="{{ s.admin_user }}"></div>
    <div class="mb-3"><label class="form-label required">原密码</label>
      <input type="password" class="form-control" name="old_password" required></div>
    <div class="mb-3"><label class="form-label required">新密码（至少 6 位）</label>
      <input type="password" class="form-control" name="new_password" minlength="6" required></div>
    <div class="mb-4"><label class="form-label required">确认新密码</label>
      <input type="password" class="form-control" name="confirm_password" minlength="6" required></div>
    <button class="btn btn-primary">修改密码</button>
  </form>
</div></div>
{% endblock %}
