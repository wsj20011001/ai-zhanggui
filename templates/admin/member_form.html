{% extends "base.html" %}
{% block title %}{{ '编辑会员' if member else '新增会员' }} - {{ shop.shop_name }}{% endblock %}
{% block content %}
<h5 class="mb-3">{{ '✏️ 编辑会员' if member else '＋ 新增会员' }}</h5>
<div class="card table-card shadow-sm" style="max-width: 520px;"><div class="card-body">
  <form method="post">
    <div class="mb-3"><label class="form-label required">姓名</label>
      <input class="form-control" name="name" required value="{{ member['name'] if member else '' }}"></div>
    <div class="mb-3"><label class="form-label required">手机号</label>
      <input class="form-control" name="phone" required value="{{ member['phone'] if member else '' }}"
             placeholder="会员唯一标识，用于收银时查找"></div>
    <div class="mb-3"><label class="form-label">等级</label>
      <select class="form-select" name="level">
        {% for lv in ['普通会员', '银卡会员', '金卡会员'] %}
        <option value="{{ lv }}" {{ 'selected' if member and member['level'] == lv }}>{{ lv }}</option>
        {% endfor %}
      </select></div>
    {% if not member %}
    <div class="row">
      <div class="col-6 mb-3"><label class="form-label">开卡充值金额（元）</label>
        <input type="number" step="0.01" min="0" class="form-control" name="balance" value="0"></div>
      <div class="col-6 mb-3"><label class="form-label">赠送积分</label>
        <input type="number" min="0" class="form-control" name="points" value="0"></div>
    </div>
    {% endif %}
    <div class="mb-3"><label class="form-label">备注</label>
      <input class="form-control" name="remark" value="{{ member['remark'] if member else '' }}"></div>
    <button class="btn btn-primary">保存</button>
    <a class="btn btn-secondary" href="{{ url_for('members.members') }}">返回</a>
  </form>
</div></div>
{% endblock %}
