{% extends "base.html" %}
{% block title %}{{ code }} · {{ shop.shop_name }}{% endblock %}
{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height:60vh">
  <div class="panel text-center" style="max-width:520px;padding:40px 36px">
    <div style="font-size:3.2rem;font-weight:700;letter-spacing:-2px;color:#4C4DDC;line-height:1">{{ code }}</div>
    <div class="mt-2" style="font-size:1.05rem;font-weight:600">{{ title }}</div>
    <div class="text-muted small mt-2" style="line-height:1.9">{{ detail }}</div>
    <div class="d-flex gap-2 justify-content-center mt-4">
      <a class="btn-ai" href="{{ url_for('ai.dashboard') }}">回驾驶舱</a>
      <a class="btn-ai-ghost" href="javascript:history.back()">返回上一页</a>
    </div>
    <div class="text-muted mt-3" style="font-size:.74rem">如果反复出现，请检查服务是否正常运行（端口 5100）</div>
  </div>
</div>
{% endblock %}
