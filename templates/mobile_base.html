<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>{% block title %}{{ shop.shop_name }}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/bootstrap.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">
</head>
<body class="mobile-body {% block body_class %}{% endblock %}">
<div class="mobile-header d-flex justify-content-between align-items-center">
  <div>{% block header_left %}{{ shop.shop_name }}{% endblock %}</div>
  <div>{% block header_right %}{% endblock %}</div>
</div>
{% block content %}{% endblock %}
<script src="{{ url_for('static', filename='bootstrap/bootstrap.bundle.min.js') }}"></script>
<script src="{{ url_for('static', filename='js/common.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
